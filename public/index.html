<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QUÉX | Pedidos abertos</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; color: #172317; background: #f6f8f3; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header { background: #1d5d35; color: white; padding: 28px max(20px, calc((100vw - 1040px) / 2)); }
      header h1 { margin: 0; font-size: 26px; } header p { margin: 6px 0 0; opacity: .9; }
      main { max-width: 1040px; padding: 28px 20px 50px; margin: auto; }
      .toolbar { display:flex; justify-content: space-between; align-items:center; gap:16px; margin-bottom:18px; }
      select, button { font: inherit; border-radius: 7px; padding: 9px 12px; }
      select { border: 1px solid #b9c3b8; background: white; } button { border: 0; cursor:pointer; background:#1d5d35; color:white; font-weight:650; }
      button:hover { background:#154727; } button:disabled { cursor:not-allowed; opacity:.55; }
      .queue { color:#5e675d; font-size:14px; } .orders { display:grid; gap:14px; }
      article { background:white; border:1px solid #dce2da; border-radius:12px; padding:18px; box-shadow:0 2px 5px #22351a0a; }
      .top { display:flex; gap:12px; align-items:flex-start; justify-content:space-between; } h2 { margin:0; font-size:18px; }
      .customer, .items { color:#4d574d; margin:5px 0 0; } .items { font-size:14px; }
      .badge { white-space:nowrap; font-size:12px; font-weight:700; padding:5px 8px; background:#e5f1e6; color:#1d5d35; border-radius:99px; }
      .payment-pending { background:#fff2cf; color:#815d00; } .payment-rejected { background:#fde4e1; color:#a2291e; }
      .info { display:flex; gap:24px; flex-wrap:wrap; margin:16px 0; font-size:14px; } .info b { display:block; color:#687167; font-size:11px; letter-spacing:.04em; text-transform:uppercase; }
      .actions { display:flex; flex-wrap:wrap; gap:8px; border-top:1px solid #edf0eb; padding-top:14px; } .outline { color:#1d5d35; background:#eef6ef; } .danger { background:#a6382e; }
      .empty, .message { padding:22px; text-align:center; background:white; border-radius:12px; border:1px solid #dce2da; color:#4d574d; } .message.error { color:#a2291e; border-color:#f2c5c0; }
      @media (max-width: 550px) { .top { flex-direction:column; } .badge { align-self:flex-start; } }
    </style>
  </head>
  <body>
    <header><h1>QUÉX</h1><p>Gerenciamento de pedidos abertos</p></header>
    <main>
      <div class="toolbar">
        <label>Pagamento: <select id="payment-filter"><option value="">Todos</option><option value="PENDING">Pendente</option><option value="VALIDATED">Validado</option><option value="REJECTED">Rejeitado</option></select></label>
        <button id="reload">Atualizar fila</button>
      </div>
      <p class="queue" id="queue-info"></p>
      <section class="orders" id="orders" aria-live="polite"></section>
    </main>
    <script>
      const ordersElement = document.querySelector('#orders');
      const filterElement = document.querySelector('#payment-filter');
      const queueInfo = document.querySelector('#queue-info');
      const statuses = { ACCEPTED: 'Aceito', PREPARING: 'Em preparo', READY: 'Pronto', OUT_FOR_DELIVERY: 'Saiu para entrega', DELIVERED: 'Entregue', CANCELLED: 'Cancelado' };
      const nextStatus = { ACCEPTED: 'PREPARING', PREPARING: 'READY', READY: 'OUT_FOR_DELIVERY', OUT_FOR_DELIVERY: 'DELIVERED' };
      const money = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });

      function escapeHtml(value) { const node = document.createElement('span'); node.textContent = value; return node.innerHTML; }
      function paymentLabel(payment) { return { PENDING: 'Pagamento pendente', VALIDATED: 'Pagamento validado', REJECTED: 'Pagamento rejeitado' }[payment.status]; }
      function paymentClass(payment) { return payment.status === 'PENDING' ? 'payment-pending' : payment.status === 'REJECTED' ? 'payment-rejected' : ''; }
      function render(orders) {
        queueInfo.textContent = `${orders.length} pedido${orders.length === 1 ? '' : 's'} na fila, em ordem de aceite.`;
        if (!orders.length) { ordersElement.innerHTML = '<div class="empty">Nenhum pedido aberto para este filtro.</div>'; return; }
        ordersElement.innerHTML = orders.map((order) => {
          const items = order.items.map((item) => `${item.quantity}× ${item.name}`).join(', ');
          const statusButton = nextStatus[order.status]
            ? `<button data-action="status" data-code="${order.orderCode}" data-next="${nextStatus[order.status]}">Avançar para ${statuses[nextStatus[order.status]]}</button>` : '';
          const paymentButtons = order.payment.status !== 'VALIDATED'
            ? `<button class="outline" data-action="approve" data-code="${order.orderCode}">Validar pagamento</button><button class="danger" data-action="reject" data-code="${order.orderCode}">Rejeitar pagamento</button>` : '';
          const locked = order.payment.status !== 'VALIDATED' && nextStatus[order.status]
            ? '<span class="queue">Valide o pagamento para avançar o pedido.</span>' : '';
          return `<article><div class="top"><div><h2>${order.position}. ${escapeHtml(order.orderCode)}</h2><p class="customer">${escapeHtml(order.customer.name)}</p><p class="items">${escapeHtml(items)}</p></div><span class="badge ${paymentClass(order.payment)}">${paymentLabel(order.payment)}</span></div><div class="info"><span><b>Status</b>${statuses[order.status]}</span><span><b>Total</b>${money.format(order.total)}</span><span><b>Aceito em</b>${new Date(order.acceptedAt).toLocaleString('pt-BR')}</span></div><div class="actions">${paymentButtons}${statusButton}${locked}</div></article>`;
        }).join('');
      }
      function showError(message) { ordersElement.innerHTML = `<div class="message error">${escapeHtml(message)}</div>`; }
      async function request(url, options) { const response = await fetch(url, options); const body = await response.json(); if (!response.ok) throw new Error(body.error || 'Não foi possível concluir a operação.'); return body; }
      async function loadOrders() {
        ordersElement.innerHTML = '<div class="message">Carregando pedidos…</div>';
        try { const query = filterElement.value ? `?paymentStatus=${filterElement.value}` : ''; const body = await request(`/api/v1/seller/orders/open${query}`); render(body.data); }
        catch (error) { showError(error.message); }
      }
      document.querySelector('#reload').addEventListener('click', loadOrders);
      filterElement.addEventListener('change', loadOrders);
      ordersElement.addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-action]'); if (!button) return;
        button.disabled = true;
        try {
          const code = button.dataset.code;
          if (button.dataset.action === 'status') await request(`/api/v1/seller/orders/${code}/status`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ status: button.dataset.next }) });
          if (button.dataset.action === 'approve') await request(`/api/v1/seller/orders/${code}/payment-validation`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ approved:true, validatedBy:'seller-demo' }) });
          if (button.dataset.action === 'reject') { const reason = prompt('Motivo da rejeição (opcional):'); if (reason === null) { button.disabled = false; return; } await request(`/api/v1/seller/orders/${code}/payment-validation`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ approved:false, validatedBy:'seller-demo', reason }) }); }
          await loadOrders();
        } catch (error) { alert(error.message); button.disabled = false; }
      });
      loadOrders();
    </script>
  </body>
</html>
